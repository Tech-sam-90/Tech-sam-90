name: Build profile, CV and website data

on:
  push:
    branches: [main]
    paths:
      - data/profile.yaml
      - templates/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README, CV source and profile.json
        run: |
          pip install -r requirements.txt
          python scripts/build.py

      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Samuel_Adeniji_CV.tex
          working_directory: cv

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/profile.json cv/Samuel_Adeniji_CV.tex cv/Samuel_Adeniji_CV.pdf
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild profile from data/profile.yaml"
            git push
          fi

      # Rebuild the website so it picks up the new profile.json and CV.
      # Add the hook URL as a repository secret named VERCEL_DEPLOY_HOOK
      # (Vercel → project → Settings → Git → Deploy Hooks).
      - name: Trigger website redeploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "Website redeploy triggered."
          else
            echo "VERCEL_DEPLOY_HOOK not set; skipping website redeploy."
          fi
