projects:
  # On the CV, project titles link to `repo`; `advisor` appears under the title.
  - id: ictc
    title: "ICTC: Instruction-Conditioned Token Compression for 3D CT Vision–Language Models"
    dates: June 2026 – Present
    org: Language and Spatial Laboratories, Carnegie Mellon University
    advisor: {name: Prof. Prasenjit Mitra, url: "https://scholar.google.com/citations?user=8PbgiPkAAAAJ&hl=en"}
    repo: https://github.com/Tech-sam-90/3d_compression
    site_status: Ongoing research
    stack: [Python, PyTorch, Vision Transformers, Perceiver, LoRA, Hugging Face, CT-RATE]
    on_cv: true
    on_readme: true
    summary: >-
      A dual-stage, instruction-conditioned token compressor for 3D chest CT. A Perceiver
      stage distils each slice and a FiLM-conditioned stage aggregates slices into a fixed
      budget of visual tokens for a LoRA-adapted language model that writes the radiology
      report. On CT-RATE validation (3,039 scans): ROUGE-L 0.273, BLEU-4 0.128,
      RaTEScore 0.801.
    note: Summer 2026 research internship with Prof. Prasenjit Mitra.
    bullets:
      - Designed a two-stage token compressor for 3D chest CT report generation. A Perceiver stage condenses each slice to 32 latents, then an instruction-conditioned stage condenses the slices into a fixed budget of visual tokens for a LoRA-adapted language model.
      - "On the CT-RATE validation set (3,039 scans): ROUGE-L 0.273, BLEU-4 0.128 and RaTEScore 0.801 for full report generation."
      - Built a multi-task instruction pipeline (report generation, entity questions, abnormality question answering) with a 368-test suite, evaluated across six token budgets from 16 to 512.
      - Now adding instruction-conditioned plane selection, where the clinical question chooses an interpretable, anatomy-aware 3D viewing plane.

  - id: fpn-mamba
    title: "FPN-Mamba: Linear-Time Bidirectional State Space Feature Pyramids for Small-Lesion Brain MRI Classification"
    dates: Feb 2026 – Present
    advisor: {name: Prof. Moise Busogi, url: "https://scholar.google.com/citations?user=TEMlkDMAAAAJ&hl=en"}
    repo: https://github.com/Tech-sam-90/fpn-inceptentionnet
    publication: fpn-mamba
    site_status: Accepted · NeurIPS 2026 Africa in AI Workshop
    stack: [Python, PyTorch, Feature Pyramid Networks, Mamba state-space models, scikit-learn]
    on_cv: true
    on_readme: true
    summary: >-
      Feature pyramid plus bidirectional Mamba for small brain-metastasis screening on
      UCSF-BMSR. It outperforms a self-attention baseline (InceptentionNet) on AUC
      (0.982 vs 0.897) and smallest-lesion recall (0.870 vs 0.788) across 5 seeds × 3 folds,
      and is 3.7× faster per step than a matched attention mixer at 512 px.
    note: NeurIPS 2026 Africa in AI workshop.
    bullets:
      - Combined a feature pyramid network with bidirectional Mamba state-space blocks to detect small brain metastases in MRI, in linear time.
      - Against a re-implemented InceptentionNet (5 seeds × 3 folds), reaches AUC 0.982 vs 0.897 and smallest-lesion recall 0.870 vs 0.788 (all p < 0.02), and trains 3.7× faster per step than a matched self-attention design at 512 pixels.
      - Accepted at the Africa in AI Workshop, NeurIPS 2026 — [OpenReview](https://openreview.net/forum?id=te52LwNBSf).

  - id: malaria-fp
    title: Investigating White Blood Cells as a Source of False-Positive Malaria Parasite Detection in African Blood-Smear Images
    readme_title: Where Do Malaria Detector False Positives Come From?
    dates: Jan 2026 – Aug 2026
    repo: https://github.com/Tech-sam-90/malaria_fp_analysis
    publication: malaria-wbc
    site_status: Oral · MICCAI 2026
    stack: [Python, PyTorch, Ultralytics YOLOv12, OpenCV, SciPy, DBSCAN, Weights & Biases]
    on_cv: true
    on_readme: true
    summary: >-
      A controlled study of two YOLOv12s detectors on 8,000 thick-smear images from Uganda
      and Ghana, using seven spatial and statistical analyses. It finds that white blood cells
      are *not* a systematic source of false positives, which redirects mitigation toward
      staining variability.
    note: MICCAI 2026 MIRASOL workshop (oral).
    bullets:
      - Ran a controlled study on 8,000 Giemsa-stained thick blood-smear images from Uganda and Ghana, comparing detectors trained with and without white blood cell labels.
      - Seven independent spatial and statistical analyses (including Ripley's Cross-K, DBSCAN and Mann–Whitney U) refuted the common belief that white blood cells cause false-positive parasite detections, pointing to staining artefacts instead.
      - Accepted for oral presentation at the MIRASOL Workshop, MICCAI 2026 — [paper](https://papers.miccai.org/miccai-2026-sat/MIRASOL_018.html) · [arXiv:2609.29663](https://arxiv.org/abs/2609.29663).

  - id: icu-cdss
    title: Condition-Aware Intensive Care Unit Early-Warning System
    readme_title: Condition-Aware ICU Deterioration Risk
    dates: Jan 2026 – May 2026
    repo: https://github.com/Tech-sam-90/condition-aware_risk_CDSS
    site_status: Completed
    stack: [Python, PyTorch, TensorFlow, MIMIC-IV, FastAPI, Docker, WebSockets, scikit-learn]
    on_cv: true
    on_readme: true
    summary: >-
      Diagnosis-conditioned early-warning models on MIMIC-IV, benchmarking six sequence
      architectures at 1–3 h horizons. The best model (BiLSTM + attention, ROC-AUC 0.76) is
      served as a Dockerized FastAPI + WebSocket streaming service, with limitations
      documented up front.
    bullets:
      - Benchmarked six diagnosis-conditioned sequence models (LSTM, GRU, TCN, BiLSTM with attention, Transformer, TFT-style) for deterioration risk on MIMIC-IV intensive care data; the best, a BiLSTM with attention, reaches ROC-AUC 0.76.
      - Deployed it as a Dockerized FastAPI service with WebSocket streaming inference, built for reproducibility under PhysioNet data governance.

  - id: survival
    title: Multimodal Cancer Survival Prediction
    dates: Fall 2026 – Present
    status: in progress
